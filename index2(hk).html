<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Driver Portal · Route · GPS · Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Replicating the FleetPass Admin Panel style */
    :root {
        --primary-color: #6366f1;
        --primary-dark: #4f46e5;
        --secondary-color: #10b981;
        --secondary-dark: #059669;
        --accent-color: #f59e0b;
        --danger-color: #ef4444;
        --warning-color: #f59e0b;
        --success-color: #10b981;
        --info-color: #3b82f6;
        
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #f1f5f9;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --border-color: #e2e8f0;
        
        --border-radius: 12px;
        --border-radius-lg: 16px;
        --border-radius-xl: 20px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-bs-theme="dark"] {
        --bs-body-bg: #0f172a;
        --bs-body-color: #f1f5f9;
        --bg-primary: #1e293b;
        --bg-secondary: #0f172a;
        --bg-tertiary: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #64748b;
        --border-color: #475569;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
        color: var(--text-primary);
        min-height: 100vh;
        transition: var(--transition);
    }
    
    header {
        background: var(--bg-primary);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        position: sticky;
        top: 0;
        z-index: 100;
    }
    
    /* Card Styling */
    .card {
        background: var(--bg-primary);
        border-radius: var(--border-radius-xl);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border-color);
        transition: var(--transition);
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .card-title-custom {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .card-title-custom::before {
        content: '';
        width: 8px;
        height: 8px;
        background: var(--primary-color);
        border-radius: 50%;
    }

    .text-gradient {
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    /* Input and Select */
    .form-control, .form-select {
        border: 2px solid var(--border-color) !important;
        background: var(--bg-secondary) !important;
        color: var(--text-primary) !important;
        border-radius: var(--border-radius) !important;
        transition: var(--transition) !important;
    }

    .form-control:focus, .form-select:focus {
        border-color: var(--primary-color) !important;
        box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.1) !important;
    }

    /* Buttons */
    .btn-primary, .btn-success {
        background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
        border: none;
        color: white;
        transition: var(--transition);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    .btn-primary:hover, .btn-success:hover, .btn-outline-primary:hover, .btn-outline-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    
    .btn-outline-primary {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 2px solid var(--border-color);
        transition: var(--transition);
    }
    
    .btn-outline-primary:hover {
        background: var(--bg-tertiary);
        border-color: var(--primary-color);
        color: var(--primary-color);
    }
    
    .btn-outline-danger {
        color: var(--danger-color);
        border-color: var(--danger-color);
    }

    /* QR Reader */
    #qr-reader {
        border: 2px dashed var(--border-color);
        border-radius: var(--border-radius);
    }

    /* Timeline */
    .timeline {
        position: relative;
        margin: 2rem 0;
        padding-left: 2rem;
    }
    .timeline::before {
        content: '';
        position: absolute;
        top: 0;
        left: 10px;
        height: 100%;
        width: 3px;
        background: var(--primary-color);
        opacity: 0.3;
        border-radius: 1.5px;
    }
    .timeline-stop {
        margin: 2.5rem 0;
        position: relative;
    }
    .timeline-stop::before {
        content: "";
        position: absolute;
        left: -20px;
        top: 0;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 3px solid var(--bg-primary);
        box-shadow: 0 0 0 2px var(--border-color);
    }
    .timeline-stop.start::before {
        background: var(--success-color);
    }
    .timeline-stop.middle::before {
        background: var(--warning-color);
    }
    .timeline-stop.end::before {
        background: var(--danger-color);
    }
    .timeline-stop span {
        margin-left: 1rem;
        font-weight: 600;
        color: var(--text-secondary);
    }
    .bus-icon {
        position: absolute;
        left: -32px;
        top: 2rem;
        font-size: 2rem;
        color: var(--primary-color);
    }
    
    .hidden {
        display: none !important;
    }

    .theme-toggle {
        background: var(--bg-tertiary);
        border: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .theme-toggle:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .theme-toggle svg {
        width: 20px;
        height: 20px;
        color: var(--text-primary);
    }
  </style>
</head>
<body data-bs-theme="light">

  <header class="py-3 px-4">
    <div class="d-flex align-items-center justify-content-between container-fluid px-0">
      <h1 id="headerTitle" class="h4 mb-0 text-gradient">Driver Portal</h1>
      <div class="d-flex align-items-center gap-2">
        <select id="languageSelect" class="form-select form-select-sm w-auto">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
        </select>
        <button id="theme-toggle" class="theme-toggle">
            <i id="sun-icon" class="bi bi-sun-fill"></i>
            <i id="moon-icon" class="bi bi-moon-fill hidden"></i>
        </button>
        <button onclick="logout()" class="btn btn-outline-primary btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
        <button class="btn btn-outline-danger btn-sm"><i class="bi bi-exclamation-octagon-fill me-1"></i> SOS</button>
      </div>
    </div>
  </header>

  <main class="container py-5">
    <div id="portal">
      <div class="card p-4 mb-4">
        <h3 id="qrTitle" class="card-title-custom">Scan Route QR</h3>
        <div id="qr-reader" class="mb-3" style="width:100%;min-height:250px"></div>
        <div class="d-flex align-items-center justify-content-between">
          <button id="toggleScan" class="btn btn-primary">Start Scanner</button>
          <div id="scanResult" class="text-secondary ms-3">No route scanned yet.</div>
        </div>
      </div>

      <div class="card p-4 mb-4">
        <h3 id="timelineTitle" class="card-title-custom">Bus Route Timeline</h3>
        <div id="timelineMap" class="timeline">
          <div class="timeline-stop start"><span id="startStop">Start</span></div>
          <div class="timeline-stop middle"><span id="stop1">Stop 1</span></div>
          <div class="timeline-stop middle"><span id="stop2">Stop 2</span></div>
          <div class="timeline-stop end"><span id="endStop">End</span></div>
          <div class="bus-icon"><i class="bi bi-bus-front-fill"></i></div>
        </div>
        <div class="d-grid">
            <button id="enableGps" class="btn btn-primary mb-2">Enable/Disable GPS</button>
        </div>
        <div id="gpsMessage" class="text-muted text-center">No GPS activity yet.</div>
      </div>

      <div class="card p-4 mb-4">
        <h3 id="feedbackTitle" class="card-title-custom">Feedback</h3>
        <textarea id="feedbackText" class="form-control mb-3" placeholder="Enter feedback"></textarea>
        <div class="d-grid">
            <button id="sendFeedback" class="btn btn-primary">Send Feedback</button>
        </div>
        <div id="feedbackStatus" class="mt-2 text-success fw-bold text-center"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    const translations = {
      en: {
        headerTitle: "Driver Portal",
        qrTitle: "Scan Route QR",
        timelineTitle: "Bus Route Timeline",
        startStop: "Start",
        stop1: "Stop 1",
        stop2: "Stop 2",
        endStop: "End",
        enableGps: "Enable/Disable GPS",
        gpsMessage: "No GPS activity yet.",
        feedbackTitle: "Feedback",
        feedbackPlaceholder: "Enter feedback",
        sendFeedback: "Send Feedback",
        scanResultDefault: "No route scanned yet.",
        logoutBtn: "Logout",
        sosBtn: "SOS"
      },
      hi: {
        headerTitle: "ड्राइवर पोर्टल",
        qrTitle: "रूट QR स्कैन करें",
        timelineTitle: "बस रूट टाइमलाइन",
        startStop: "प्रारंभ",
        stop1: "स्टॉप 1",
        stop2: "स्टॉप 2",
        endStop: "अंत",
        enableGps: "जीपीएस सक्षम/अक्षम करें",
        gpsMessage: "कोई जीपीएस गतिविधि नहीं।",
        feedbackTitle: "प्रतिक्रिया",
        feedbackPlaceholder: "फीडबैक दर्ज करें",
        sendFeedback: "फीडबैक भेजें",
        scanResultDefault: "अभी तक कोई रूट स्कैन नहीं किया गया।",
        logoutBtn: "लॉगआउट",
        sosBtn: "एसओएस"
      }
    };

    const languageSelect = document.getElementById('languageSelect');
    languageSelect.addEventListener('change', () => updateLanguage(languageSelect.value));

    function updateLanguage(lang){
      const t = translations[lang];
      if(!t) return;
      document.getElementById('headerTitle').textContent = t.headerTitle;
      document.getElementById('qrTitle').textContent = t.qrTitle;
      document.getElementById('timelineTitle').textContent = t.timelineTitle;
      document.getElementById('startStop').textContent = t.startStop;
      document.getElementById('stop1').textContent = t.stop1;
      document.getElementById('stop2').textContent = t.stop2;
      document.getElementById('endStop').textContent = t.endStop;
      document.getElementById('enableGps').textContent = t.enableGps;
      document.getElementById('gpsMessage').textContent = t.gpsMessage;
      document.getElementById('feedbackTitle').textContent = t.feedbackTitle;
      document.getElementById('feedbackText').placeholder = t.feedbackPlaceholder;
      document.getElementById('sendFeedback').textContent = t.sendFeedback;
      document.querySelector('button.btn-outline-primary').innerHTML = `<i class="bi bi-box-arrow-right me-1"></i> ${t.logoutBtn}`;
      document.querySelector('button.btn-outline-danger').innerHTML = `<i class="bi bi-exclamation-octagon-fill me-1"></i> ${t.sosBtn}`;
      const scanResult = document.getElementById('scanResult');
      if([translations.en.scanResultDefault, translations.hi.scanResultDefault].includes(scanResult.textContent)){
        scanResult.textContent = t.scanResultDefault;
      }
    }

    // Theme Management
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const body = document.body;

    // Initialize theme
    const savedTheme = localStorage.getItem('theme') || 'light';
    body.setAttribute('data-bs-theme', savedTheme);
    if (savedTheme === 'dark') {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
    } else {
        moonIcon.classList.add('hidden');
        sunIcon.classList.remove('hidden');
    }

    themeToggle.addEventListener('click', () => {
        const currentTheme = body.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        body.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        
        if (newTheme === 'dark') {
            sunIcon.classList.add('hidden');
            moonIcon.classList.remove('hidden');
        } else {
            moonIcon.classList.add('hidden');
            sunIcon.classList.remove('hidden');
        }
    });

    // Set default language
    updateLanguage('en');

    // --- Existing JS for QR, GPS, Feedback ---
    let html5QrScanner = null;
    let scanning = false;
    let watchId = null;

    document.getElementById('toggleScan').addEventListener('click',()=>{
      const btn=document.getElementById('toggleScan');
      if(!scanning){
        html5QrScanner=new Html5Qrcode("qr-reader");
        html5QrScanner.start({facingMode:"environment"},{fps:10,qrbox:250},(decodedText)=>{
          document.getElementById('scanResult').textContent='Scanned: '+decodedText;
        }).then(()=>{
          scanning=true;
          btn.textContent='Stop Scanner';
        }).catch(err=>{
          document.getElementById('scanResult').textContent='QR Scanner error: '+err;
        });
      } else {
        html5QrScanner.stop().then(()=>{
          html5QrScanner.clear();
          html5QrScanner=null;
          scanning=false;
          btn.textContent='Start Scanner';
          document.getElementById('scanResult').textContent='Scanner stopped.';
        });
      }
    });

    document.getElementById('enableGps').addEventListener('click',()=>{
      if(watchId!==null){
        navigator.geolocation.clearWatch(watchId);
        watchId=null;
        document.getElementById('gpsMessage').textContent='GPS stopped';
        return;
      }
      if(!navigator.geolocation){
        alert('GPS not supported on this browser');
        return;
      }
      watchId=navigator.geolocation.watchPosition((pos)=>{
        const {latitude,longitude}=pos.coords;
        document.getElementById('gpsMessage').textContent = `Lat: ${latitude.toFixed(5)}, Lng: ${longitude.toFixed(5)}`;
      },(err)=>{
        let msg;
        switch(err.code){
          case err.PERMISSION_DENIED: msg='Permission denied for GPS access'; break;
          case err.POSITION_UNAVAILABLE: msg='Position unavailable'; break;
          case err.TIMEOUT: msg='GPS request timed out'; break;
          default: msg='Unknown GPS error';
        }
        document.getElementById('gpsMessage').textContent='GPS error: '+msg;
      },{enableHighAccuracy:true,timeout:10000,maximumAge:0});
    });

    document.getElementById('sendFeedback').addEventListener('click',()=>{
      const txt=document.getElementById('feedbackText').value.trim();
      if(!txt){document.getElementById('feedbackStatus').textContent='Enter feedback';return}
      document.getElementById('feedbackStatus').textContent='Feedback saved locally (demo).';
      document.getElementById('feedbackText').value='';
    });

    function logout() {
      localStorage.clear();
      window.location.href = 'ALoginPage.html';
    }
  </script>
</body>
</html>
